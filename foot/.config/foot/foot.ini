[main]
# Keep text standard, but pump up the size for your standalone Nerd Font icons!
font = JetBrains Mono:size=11, Symbols Nerd Font:size=14
letter-spacing = 1
line-height = 14
#pad = 6x6

# Let Foot render geometry natively for perfect smoothness
box-drawings-uses-font-glyphs = no

# Prevent wide icons from clipping into adjacent characters
dpi-aware = yes

[colors-dark]
# THE FIX: This sets your background transparency
# 0.0 is completely invisible, 1.0 is completely solid opaque.
# A value of 0.85 gives a beautiful, clean blur-friendly transparency.
alpha = 0.85
