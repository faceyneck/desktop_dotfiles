# More option see https://github.com/DreamMaoMao/mango/wiki/


# ===============================================================================
# ADDING FUCKING NUMLOCK FUCKING FUCK!!!!!
# ===============================================================================
numlockon=1



# ==============================================================================
# UNIVERSAL WAYLAND ENVIRONMENT
# ==============================================================================
env = XDG_CURRENT_DESKTOP,wlroots
env = XDG_SESSION_DESKTOP,wlroots
env = XDG_SESSION_TYPE,wayland
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland

# ==============================================================================
# LAPTOP NVIDIA FIXES
# ==============================================================================
env = WLR_NO_HARDWARE_CURSORS,1
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# ==============================================================================
# AUDIO CONTROL (Using PulseAudio / PipeWire)
# ==============================================================================
bind = NONE, XF86AudioRaiseVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = NONE, XF86AudioLowerVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = NONE, XF86AudioMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# ==============================================================================
# MEDIA PLAYER CONTROLS (Play/Pause, Next, Prev via playerctl)
# ==============================================================================
bind = NONE, XF86AudioPlay, spawn, playerctl play-pause
bind = NONE, XF86AudioNext, spawn, playerctl next
bind = NONE, XF86AudioPrev, spawn, playerctl previous

# ==============================================================================
# LAPTOP DISPLAY BRIGHTNESS (Requires 'brightnessctl' installed via DNF)
# ==============================================================================
bind = NONE, XF86MonBrightnessUp, spawn, brightnessctl set +5%
bind = NONE, XF86MonBrightnessDown, spawn, brightnessctl set 5%-


# Start swaybg for background image
exec-once = swaybg --image /home/faceyneck/.local/share/wallpapers/02.png -m fill

# Start Notification Daemon
exec-once = mako
# Start waybar
exec-once = waybar -c ~/.config/waybar/mango-config.jsonc -s ~/.config/waybar/mango-style.css
# Example: Network Manager Applet (Wi-Fi tray icon)
exec-once = nm-applet --indicator

# Example: Audio/Volume Tray applet (if you aren't using a pure keybind)
exec-once = pasystray

# Example: Bluetooth control tray icon
exec-once = blueman-applet
# Reload Waybar
bind=SUPER+SHIFT,r,spawn,sh -c "killall waybar; waybar -c ~/.config/waybar/mango-config.jsonc -s ~/.config/waybar/mango-style.css"



# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=9
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
overviewgappi=5
overviewgappo=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focusdir_only_zone_overlap=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# Core System Controls (Sway Style)
bind=SUPER+SHIFT,c,reload_config
bind=SUPER+SHIFT,e,quit
bind=SUPER+SHIFT,q,killclient,

# Menu and Terminal Spawners
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,Return,spawn,foot
# Launch rofimoji picker
bind = SUPER,period,spawn,rofimoji

# ------------------------------------------------------------------------------
# WINDOW FOCUS DIRECTIONAL CLUSTER (Sway Arrows Behavior)
# ------------------------------------------------------------------------------
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# ------------------------------------------------------------------------------
# MOVE/SWAP WINDOW POSITIONS (SUPER + SHIFT + ARROWS)
# ------------------------------------------------------------------------------
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# Window Geometry Rules (Shifted to clear application shortcuts)
bind=SUPER,g,toggleglobal,
bind=SUPER+SHIFT,Tab,togglejump,
bind=SUPER,backslash,togglefloating,
bind=SUPER+SHIFT,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized,
bind=ALT,z,toggle_scratchpad

# Dynamic Tiling Layout Controls
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=SUPER,n,switch_layout

# Advanced Scroller Layout Bindings
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

# Dwindle Layout Auto-Split
bind=alt+shift,Return,dwindle_toggle_split_direction

# ==============================================================================
# WORKSPACE NAVIGATION (SUPER + 1-9)
# ==============================================================================
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Switch to workspace using the Numpad
# Switch to tag (NumLock ON -> Fires numeric strings)
bind=SUPER,KP_1,view,1,0
bind=SUPER,KP_2,view,2,0
bind=SUPER,KP_3,view,3,0
bind=SUPER,KP_4,view,4,0
bind=SUPER,KP_5,view,5,0
bind=SUPER,KP_6,view,6,0
bind=SUPER,KP_7,view,7,0
bind=SUPER,KP_8,view,8,0
bind=SUPER,KP_9,view,9,0
bind=SUPER,KP_0,view,10,0

# Move window to tag (NumLock ON + SHIFT -> Inverts keys to positional strings)
bind=SUPER+SHIFT,KP_End,tag,1,0
bind=SUPER+SHIFT,KP_Down,tag,2,0
bind=SUPER+SHIFT,KP_Page_Down,tag,3,0
bind=SUPER+SHIFT,KP_Left,tag,4,0
bind=SUPER+SHIFT,KP_Begin,tag,5,0
bind=SUPER+SHIFT,KP_Right,tag,6,0
bind=SUPER+SHIFT,KP_Home,tag,7,0
bind=SUPER+SHIFT,KP_Up,tag,8,0
bind=SUPER+SHIFT,KP_Page_Up,tag,9,0
bind=SUPER+SHIFT,KP_Insert,tag,10,0

# ==============================================================================
# SEND WINDOW TO WORKSPACE (SUPER + SHIFT + 1-9)
# ==============================================================================
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Monitor Display Multi-Head Routing
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# Window Gaps Modifications
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# Absolute Tiling Adjustments
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# Manual Resize Layout Engine
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Controls
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Layout Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# External Layer Overlays
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# ==============================================================================
# gammasteppy
# ==============================================================================
bind=SUPER+SHIFT,g,spawn,/home/faceyneck/scripts/gammasteppy

# ==============================================================================
# SCRATCHPAD MANAGEMENT & FOOT TERMINAL STUFF
# ==============================================================================
windowrule=isnamedscratchpad:1,width:1820,height:1020,appid:foot-scratch

bind=none,f12,toggle_named_scratchpad,foot-scratch,none,foot --app-id=foot-scratch

# ==============================================================================
# SECONDARY AUDIO MIXER SCRATCHPAD (PAVUCONTROL)
# ==============================================================================
# 1. Define the Window Rule (Matches pavucontrol's native Wayland app_id)
windowrule=isnamedscratchpad:2,width:1000,height:650,appid:pavucontrol

# 2. Bind SUPER + U to toggle the volume mixer panel instantly
bind=SUPER,u,toggle_named_scratchpad,pavucontrol,none,pavucontrol

# Toggle HDR on the currently focused monitor (Mnemonic: B = Brightness/Blaze)
bind=SUPER+ALT,b,spawn,mmsg dispatch togglehdr


